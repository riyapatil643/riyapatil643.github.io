<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <header class="top">
      <h1>To-Do List</h1>
      <p class="subtitle">Add tasks • Complete tasks • Delete tasks</p>
    </header>

    <section class="add-area">
      <input
        id="taskInput"
        type="text"
        placeholder="Type a task and press Enter..."
        autocomplete="off"
      />
      <button id="addBtn">Add</button>
    </section>

    <section class="list-area">
      <h2 class="list-title">Your Tasks</h2>

      <ul id="taskList"></ul>

      <p id="emptyText" class="empty-text">No tasks yet. Add your first one ✨</p>
    </section>

    <footer class="footer">
      <p>Made with HTML • CSS • Vanilla JS</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
